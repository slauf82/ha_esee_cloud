views:
- title: Kameras
  path: kameras
  type: sections
  sections:
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.kamera_dashboard_entsperrt
        state: 'off'
      card:
        type: vertical-stack
        cards:
        - type: heading
          heading: Kamera-Dashboard gesperrt
          icon: mdi:lock
        - type: entities
          entities:
          - entity: input_text.kamera_dashboard_pin
            name: PIN
          - entity: counter.kamera_dashboard_fehlversuche
            name: Fehlversuche
          - entity: timer.kamera_dashboard_sperrzeit
            name: Sperrzeit
        - type: button
          entity: input_button.kamera_dashboard_entsperren
          name: Dashboard entsperren
          icon: mdi:lock-open
          tap_action:
            action: call-service
            service: input_button.press
            target:
              entity_id: input_button.kamera_dashboard_entsperren
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.kamera_dashboard_entsperrt
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: heading
          heading: Kameraansicht
        - type: entities
          entities:
          - entity: input_select.dashboard_view
            name: Ansicht
          - entity: input_select.gebaeude_auswahl
            name: Gebäude
          - entity: input_select.kamera_auswahl
            name: Aktive PTZ-Kamera
        - type: button
          entity: input_button.kamera_dashboard_sperren
          name: Dashboard sperren
          icon: mdi:lock
          tap_action:
            action: call-service
            service: input_button.press
            target:
              entity_id: input_button.kamera_dashboard_sperren
  - type: grid
    cards:
    - type: conditional
