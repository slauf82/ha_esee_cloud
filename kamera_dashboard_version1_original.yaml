      card:
        square: true
        type: grid
        title: Haus
        columns: 2
        cards:
        - show_state: true
          show_name: true
          camera_view: live
          fit_mode: cover
          type: picture-entity
          entity: camera.192_168_2_22_0_1
          name: Kamera 1
          tap_action:
            action: call-service
            service: input_select.select_option
            target:
              entity_id: input_select.kamera_auswahl
            data:
              option: Kamera 1
        - show_state: true
