          columns: 3
          square: true
          cards:
          - type: button
            name: ''
          - type: button
            name: ⬆️
            tap_action:
              action: call-service
              service: script.kamera_ptz_joystick
              data:
                richtung: up
            hold_action:
              action: call-service
              service: script.kamera_ptz_joystick
              data:
                richtung: up
          - type: button
            name: ''
          - type: button
            name: ⬅️
            tap_action:
              action: call-service
              service: script.kamera_ptz_joystick
              data:
                richtung: left
            hold_action:
              action: call-service
