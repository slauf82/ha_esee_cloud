            name: 🔍+
            tap_action:
              action: call-service
              service: script.kamera_ptz_joystick
              data:
                richtung: zoom_in
            hold_action:
              action: call-service
              service: script.kamera_ptz_joystick
              data:
                richtung: zoom_in
          - type: button
            name: 🔍-
